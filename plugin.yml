name: ElementaMine
version: '1.0.0'
main: fr.elementa.mine.ElementaMine
api-version: '26.1'
author: Elementa
description: Systeme de mine personnelle evolutive pour Elementa

softdepend: [VaultUnlocked, Vault]

commands:
  mine:
    description: Commandes d'administration de la mine
    usage: /mine <setpos1|setpos2|create|reset|info>
    permission: elementa.mine.admin
  sac:
    description: Gere ton sac de ressources minees
    usage: /sac [vendre|autosell|upgrade]
